experiment:
  name: rollout_self_debug_model_revision
  seed: 20260601

data:
  tasks: configs/datasets/tasks.example.jsonl
  split: train
  limit: 10
  skip_quality_checks: false
  near_duplicate_threshold: 0.92

prompt:
  template: direct_solution_v1

rollout:
  mode: self_debug

generation:
  backend: mock
  samples_per_task: 4
  max_new_tokens: 512
  temperature: 0.8
  top_p: 0.95

self_debug:
  max_revisions: 1
  revision_strategy: model
  revision_prompt_template: self_debug_revision_v1
  revision_max_new_tokens: 384
  revision_temperature: 0.2
  revision_top_p: 0.9
  revision_reward_discount: 0.9

execution:
  include_hidden: true

reward:
  mode: correctness_v0

output:
  rollouts: outputs/rollouts/self_debug_model_revision.jsonl
  traces: outputs/reports/self_debug_model_revision_traces.jsonl
