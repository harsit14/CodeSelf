experiment:
  name: ppo_online_toy_launch_smoke
  seed: 20260601
algorithm: ppo
data:
  tasks: data/processed/codeself_tasks.jsonl
  split: train
  limit: 2
  skip_quality_checks: false
output:
  dir: artifacts/ppo_online_toy_launch_smoke
model:
  backend: toy
  vocab_size: 2048
prompt:
  template: direct_solution_v1
rollout:
  mode: direct
  group_size: 2
  samples_per_task: 2
  max_prompt_tokens: 128
  max_response_tokens: 128
  temperature: 0.0
  top_p: 1.0
execution:
  include_hidden: true
batch:
  response_source: raw_completion
  include_failed_parses: true
training:
  max_batches: 1
  step_scheduler: true
  dtype: fp32
  optimizer:
    learning_rate: 0.05
    weight_decay: 0.0
    warmup_steps: 0
    gradient_accumulation_steps: 1
    max_grad_norm: 1.0
  loss:
    clip_epsilon: 0.2
    value_clip_epsilon: null
    value_loss_coef: 0.5
    entropy_coef: 0.0
    kl_beta: 0.0
    gamma: 1.0
    gae_lambda: 1.0
    normalize_advantages: false
    max_log_ratio: 20.0
