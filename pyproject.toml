[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeself"
version = "0.1.0"
description = "Self-improving coding agent research scaffold with execution-based reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "CodeSelf contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10"
]
training = [
  "accelerate",
  "datasets",
  "numpy",
  "peft",
  "torch",
  "transformers",
  "trl",
  "vllm"
]
reporting = [
  "duckdb",
  "pandas",
  "plotly",
  "scipy"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
