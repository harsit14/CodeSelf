[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeself"
version = "0.1.0"
description = "Execution-feedback reinforcement learning (GRPO and PPO) for small code language models, with a hardened sandbox and paired statistical evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Harsit Upadhya" }
]
keywords = [
  "reinforcement-learning",
  "grpo",
  "ppo",
  "code-generation",
  "llm",
  "rlhf",
  "sandbox",
  "evaluation"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research"
]
dependencies = []

[project.urls]
Repository = "https://github.com/harsit14/CodeSelf"
Methodology = "https://github.com/harsit14/CodeSelf/blob/main/methodology.md"

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10"
]
training = [
  "accelerate",
  "datasets",
  "numpy",
  "peft",
  "torch",
  "transformers",
  "trl"
]
# vLLM is a fast-inference backend that does not build on macOS/MPS. It is an
# optional accelerator for CUDA hosts, kept out of the default training extra
# so `pip install -e .[training]` works on Apple Silicon.
vllm = [
  "vllm"
]
tracking = [
  "wandb",
  "tensorboard"
]
reporting = [
  "duckdb",
  "pandas",
  "plotly",
  "scipy"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Tests put src/ on sys.path before importing the package.
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
